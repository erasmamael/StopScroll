# Réglages globaux de Gradle.

# Mémoire allouée au processus Gradle (2 Go suffisent largement ici).
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Le "configuration cache" accélère les builds suivants en mémorisant
# la phase de configuration quand les scripts n'ont pas changé.
org.gradle.configuration-cache=true

# Style de code Kotlin officiel.
kotlin.code.style=official
